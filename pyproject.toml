[project]
name = "reposemergente"
version = "0.1.0"
description = "Central repo for automated grading of Emergente coursework"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "taskipy"]

[tool.taskipy.tasks]
test               = "pytest repo-template/tests correcciones/tests parciales/tests"
validate-format    = "python formatos/validador.py"
grade              = "python correcciones/calificador.py"
grade-update       = "python correcciones/calificador.py --update"
grade-corte        = "python correcciones/calificador_corte.py"
grade-corte-update = "python correcciones/calificador_corte.py --update"
grade-corte-2      = "python correcciones/calificador_corte.py --corte corte-preguntas-2"
grade-corte-2-update = "python correcciones/calificador_corte.py --corte corte-preguntas-2 --update"
grade-corte-3      = "python correcciones/calificador_corte.py --corte corte-preguntas-3"
grade-corte-3-update = "python correcciones/calificador_corte.py --corte corte-preguntas-3 --update"
grade-corte-4      = "python correcciones/calificador_corte.py --corte corte-preguntas-4"
grade-corte-4-update = "python correcciones/calificador_corte.py --corte corte-preguntas-4 --update"
export-moodle      = "python correcciones/exportar_moodle.py"
import-bank        = "python parciales/banco.py"
build-exam         = "python parciales/armar.py"
build-form         = "python parciales/publicar.py"
publish-forms      = "python parciales/publicar.py --push"
answer-key         = "python parciales/clave.py"
report-infractions = "python scripts/reportar_infracciones.py"
create-repos       = "pwsh -File scripts/crear-repos-trimestre.ps1"
update-repos       = "pwsh -File scripts/actualizar-repos-trimestre.ps1"
clone-all          = "bash scripts/clonar-todos.sh"
run-corrections    = "gh workflow run correcciones-paralelas.yml"
run-guards         = "gh workflow run guards-copias.yml"

[tool.pytest.ini_options]
# correcciones/ and parciales/ are flat folders of modules (calificador, banco, ...), not packages
pythonpath = ["correcciones", "parciales"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
